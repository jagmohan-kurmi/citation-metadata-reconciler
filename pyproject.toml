[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citation-metadata-reconciler"
version = "0.1.0"
description = "Validate bibliography metadata and review user-supplied match candidates."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Academic Research Tools contributors"}]

[project.scripts]
citation-metadata-reconciler = "citation_metadata_reconciler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
